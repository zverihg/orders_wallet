# Общие настройки для dev-контейнеров Django (код на хосте, одна БД).
x-django-dev: &django-dev
  build: .
  volumes:
    - .:/usr/src/app
  environment:
    - DJANGO_SETTINGS_MODULE=orders_wallet.settings
  depends_on:
    - pgdb

# Определение версии Docker Compose и начало описания сервисов

services:
  # для удобства в IDE и запусках тестов
  alpine-django:
    <<: *django-dev
    container_name: order-alpine

  django:
    <<: *django-dev
    container_name: order_django
    command: python manage.py runserver 0.0.0.0:8000 #python3 manage.py runserver_plus --cert-file cert.pem --key-file key.pem  #
    ports:
      - 8000:8000

  # ASGI + Ariadne: GraphiQL с Explorer (клики по схеме) — http://localhost:4000/graphql/
  graphql-ariadne:
    <<: *django-dev
    container_name: orders_wallet-graphql-ariadne
    ports:
      - '4000:4000'
    command: uvicorn orders_wallet.asgi:application --host 0.0.0.0 --port 4000

  pgdb:
    # Использование готового образа postgres
    image: postgis/postgis:17-3.6-alpine
    # Задание переменных окружения для контейнера с postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
     # Задание имени контейнера для сервиса pgdb (уникально для проекта, чтобы не конфликтовать с другими pgdb)
    container_name: orders_wallet_pgdb
    ports:
      - 5433:5432
     # Связывание тома с директорией в контейнере для сохранения данных postgres
    volumes:
      - pgdbdata:/var/lib/postgresql/data/

volumes:
  pgdbdata: null
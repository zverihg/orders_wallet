type OrdersByCustomerResult {
  orders: [Order!]!
  totalCount: Int!
}

input CreateOrderInput {
  customerId: String!
  items: [OrderItemInput!]!
}

input OrderItemInput {
  productId: String!
  quantity: Int!
  price: Decimal!
}

type CreateOrderPayload {
  orderId: String!
  status: String!
}

type CapturePaymentPayload {
  orderId: UUID!
  status: String!
  amountDebited: Decimal!
}

type RefundOrderPayload {
  orderId: UUID!
  status: String!
  amountRefunded: Decimal!
}

type Order {
  id: UUID!
  customerId: UUID!
  status: String!
  totalAmount: Decimal!
  items: [OrderItem!]!
  createdAt: DateTime
}

type OrderItem {
  productId: UUID!
  quantity: Int!
  price: Decimal!
  subtotal: Decimal!
}

type WalletBalance {
  customerId: String!
  balance: Decimal!
}

type walletOperationsPayload{
  status: String!
}

input walletOperationsInput{
  customerId: UUID!
  amount: Decimal!
}
type OrdersByCustomerResult {
  orders: [Order!]!
  totalCount: Int!
  limit: Int!
  offset: Int!
  hasNextPage: Boolean!
}

input CreateOrderInput {
  customerId: UUID!
  items: [OrderItemInput!]!
}

input OrderItemInput {
  productId: UUID!
  quantity: Int!
  price: Decimal!
}

type CreateOrderPayload {
  orderId: UUID
  status: String!
  errorCode: String
  errorMessage: String
}

type CapturePaymentPayload {
  orderId: UUID!
  status: String!
  amountDebited: Decimal
  errorCode: String
  errorMessage: String
}

type RefundOrderPayload {
  orderId: UUID!
  status: String!
  amountRefunded: Decimal
  errorCode: String
  errorMessage: String
}

type Order {
  id: UUID!
  customerId: UUID!
  status: String!
  totalAmount: Decimal!
  items: [OrderItem!]!
  createdAt: DateTime
}

type OrderItem {
  productId: UUID!
  quantity: Int!
  price: Decimal!
  subtotal: Decimal!
}

type WalletBalance {
  customerId: UUID!
  balance: Decimal
  errorCode: String
  errorMessage: String
}

type walletOperationsPayload{
  status: String!
  errorCode: String
  errorMessage: String
}

input walletOperationsInput{
  customerId: UUID!
  amount: Decimal!
}
